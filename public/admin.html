<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G IOTK · Administración</title><link rel="stylesheet" href="/styles.css?v=1.8.2"></head><body><div class="wrap"><div class="top"><div class="brandline"><img class="altronics-logo" src="/assets/lOGO Iotek Latam.png" alt="Altronics Chile"><div class="brand">GAME</div></div><div class="admin-actions"><button id="musicAdmin" class="icon-btn music-toggle" type="button" title="Activar o desactivar música" aria-label="Activar o desactivar música">♫</button><label class="volume-control compact" title="Volumen"><span class="volume-icon" aria-hidden="true">🔊</span><input id="volumeAdmin" type="range" min="100" max="400" value="300" step="10" aria-label="Volumen"><span id="volumeValue">300%</span></label><button id="newQuiz" class="btn alt">+ Nuevo cuestionario</button> <button id="save" class="btn">Guardar</button> <button id="play" class="btn good">Modo juego</button></div></div><div class="grid"><aside class="panel"><h3>Cuestionarios guardados</h3><div id="quizList"></div></aside><main class="panel"><label class="label">Nombre del cuestionario</label><input id="title" class="input" placeholder="Ej. Seguridad informática"><div class="row" style="margin-top:16px"><h3>Preguntas</h3><button id="addQ" class="btn alt" style="flex:0 0 auto">+ Pregunta</button></div><div id="questions"></div></main></div></div><footer class="app-version">Versión 1.8.2</footer><script src="/admin.js?v=1.8.2"></script></body></html>
